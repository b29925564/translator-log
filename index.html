<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>記譯 Witimemo</title>
    <meta name="description" content="自由譯者的案件紀錄、收款追蹤、履歷產生與年度回顧。離線可用，跨裝置端對端加密同步。" />
    <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="記譯" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="記譯 Witimemo" />
    <meta property="og:description" content="每一個字，都算數。自由譯者的案件紀錄、收款追蹤、履歷產生與年度回顧。" />
    <meta property="og:image" content="og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    />
    <script>
      // apply a chosen light/dark theme before first paint (App keeps this in sync)
      try {
        var t = localStorage.getItem('wt-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-wt-theme', '1');
        }
      } catch (e) {}
    </script>
    <style>
      /* paints before the stylesheet arrives; the lowest layer, so the app's theme tokens always win */
      @layer boot, theme, base, components, utilities;
      @layer boot {
        html { background: #f4f4f2; }
        @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #09090a; } }
        html[data-theme="dark"] { background: #09090a; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
